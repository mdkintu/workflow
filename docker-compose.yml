name: workflow

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_HOST: ${SITE_HOST}
      CADDY_TLS: ${CADDY_TLS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${APP_IMAGE:-workflow:latest}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["gunicorn", "workflow.wsgi", "-b", "0.0.0.0:8000", "-w", "${GUNICORN_WORKERS:-3}"]
    volumes:
      - media:/data/media
      - static:/data/static
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${APP_IMAGE:-workflow:latest}
    restart: unless-stopped
    env_file: .env
    # -l info: without it Celery drops the app's INFO logs (e.g. which
    # notifications were sent) — the worker's default level is WARNING.
    command: ["celery", "-A", "workflow", "worker", "-Q", "default,notifications", "-l", "info"]
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A workflow inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: ${APP_IMAGE:-workflow:latest}
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "workflow", "beat", "-l", "info"]
    # No healthcheck: Beat has no cheap liveness probe (it just sleeps
    # between ticks). `restart: unless-stopped` still recovers it on crash.
    # Exactly one Beat instance should ever run (docs/02-architecture.md §5).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
    # Loopback-only: lets native processes (`make dev`, see CLAUDE.md) reach
    # this container as localhost:${DB_PORT}. Never exposed off-host.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # Loopback-only, for `make dev` — see the `db` service's comment above.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `make test` / `docker compose --profile test run --rm test`
  test:
    image: workflow:dev
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      DJANGO_SETTINGS_MODULE: workflow.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-workflow}
      REDIS_URL: redis://redis:6379/0
    command: ["pytest"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
